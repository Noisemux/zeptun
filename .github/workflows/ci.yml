name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: unit tests debug
        run: zig build test --summary all
      - name: unit tests release safe
        run: zig build test -Doptimize=safe --summary all
      - name: c abi smoke test
        run: zig build test-ffi
      - name: mobile feature set
        run: zig build test -Dmobile=true --summary all
      - name: allow unprivileged namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo modprobe tun || true
          unshare --user --map-root-user --net true
      - name: tests inside network namespace
        run: zig build test-netns
      - name: end to end integration
        run: zig build test-integration -Doptimize=safe

  cross:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - x86_64-linux-musl
          - aarch64-linux-gnu
          - aarch64-linux-musl
          - aarch64-linux-android
          - arm-linux-androideabi
          - x86_64-linux-android
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-windows-msvc
          - aarch64-windows-msvc
          - x86_64-macos
          - aarch64-macos
          - aarch64-ios
          - aarch64-ios-simulator
          - x86_64-freebsd
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=fast -Dstrip=true
      - name: compile tests
        if: ${{ !contains(matrix.target, 'android') && !contains(matrix.target, 'ios') }}
        run: zig build test-compile -Dtarget=${{ matrix.target }}
      - name: stage
        run: sh scripts/stage_artifact.sh artifact
      - uses: actions/upload-artifact@v7
        with:
          name: zeptun-${{ matrix.target }}
          path: artifact
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: build jniLibs
        run: zig build android -Doptimize=small
      - name: check 16 KB page alignment
        run: |
          for so in zig-out/android/jniLibs/*/libzeptun.so; do
            align=$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF; exit }')
            echo "$so $align"
            [ "$align" = "0x4000" ]
          done
      - uses: actions/upload-artifact@v7
        with:
          name: zeptun-android-jniLibs
          path: zig-out/android

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: unit tests
        run: zig build test --summary all
      - name: xcframework
        run: sh scripts/make_xcframework.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Zeptun.xcframework
          path: zig-out/Zeptun.xcframework

  macos-tunnel:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: build
        run: zig build -Doptimize=fast
      - name: tunnel through a real utun device
        env:
          LOG_DIR: ${{ github.workspace }}/macos-logs
        run: |
          mkdir -p "$LOG_DIR"
          sudo -E sh scripts/macos_integration.sh zig-out/bin/zeptun
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: macos-tunnel-logs
          path: macos-logs
          if-no-files-found: ignore

  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: c abi test inside the simulator
        run: sh scripts/ios_simulator.sh
      - name: xcframework
        run: sh scripts/make_xcframework.sh

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: unit tests
        run: zig build test --summary all
      - name: release build
        run: zig build -Doptimize=fast

  bench-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: baseline from the base commit
        continue-on-error: true
        run: |
          git worktree add "$RUNNER_TEMP/base" "${{ github.event.pull_request.base.sha }}"
          cd "$RUNNER_TEMP/base"
          zig build bench -Doptimize=fast -- --min-ms 600
          cp zig-out/bench/micro.json "$GITHUB_WORKSPACE/micro-base.json"
      - name: candidate against baseline
        run: |
          if [ -f micro-base.json ]; then
            zig build bench -Doptimize=fast -- --min-ms 600 --baseline micro-base.json --max-regression 20
          else
            zig build bench -Doptimize=fast -- --min-ms 600
          fi
      - name: summary
        if: always()
        run: cat zig-out/bench/micro.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: micro-bench
          path: |
            zig-out/bench
            micro-base.json

  bench-main:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: microbenchmarks
        run: zig build bench -Doptimize=fast -- --min-ms 600
      - name: summary
        run: cat zig-out/bench/micro.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: micro-bench-${{ github.sha }}
          path: zig-out/bench
